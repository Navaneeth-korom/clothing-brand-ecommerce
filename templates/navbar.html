{% load static %}
<header class="site-header">
    <nav class="navbar" aria-label="Main navigation">
        <a href="{% url 'home' %}" class="logo" aria-label="Home">
            <span class="logo-mark">L</span>
            <span>Lumina</span>
        </a>

        <ul class="nav-menu">
            <li><a class="nav-link" href="{% url 'home' %}">Home</a></li>
            <li><a class="nav-link" href="{% url 'products' %}">Shop</a></li>
            <li><a class="nav-link" href="#">About</a></li>
            <li><a class="nav-link" href="{% url 'contact' %}">Contact</a></li>
            {% if user.is_authenticated %}
                <li><a class="nav-link" href="{% url 'cart' %}">Cart</a></li>
                <li><a class="logout-btn" href="{% url 'logout' %}">Logout</a></li>
            {% else %}
                <li><a class="auth-button" href="{% url 'login' %}">Login / Register</a></li>
            {% endif %}
        </ul>
    </nav>
</header>
